name: Tjek drejeskiver

on:
  schedule:
    # Hvert 10. minut. GitHub springer mange planlagte kørsler over, så vi beder
    # om flere end vi har brug for, så der i praksis kommer en ca. hver halve time.
    # GitHub bruger UTC, så 5-22 UTC dækker kl. 7-23 dansk tid sommer og vinter.
    # Scriptet springer selv over uden for kl. 7-23.
    - cron: "3,13,23,33,43,53 5-22 * * *"
  workflow_dispatch: {}   # "Run workflow"-knappen og cron-job.org bruger denne

permissions:
  contents: write         # så state.json kan gemmes tilbage i repoet

concurrency:
  group: tjek
  cancel-in-progress: false

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # hent altid nyeste state.json, også hvis kørslen har stået i kø

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Tjek ledige tider
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python check.py

      - name: Gem tilstand
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "drejeskive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Opdater state"
            git push
          else
            echo "Ingen ændringer"
          fi
